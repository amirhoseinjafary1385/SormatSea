{% extends 'marketplace/base.html' %}
{% load static %}

{% block title %}Password Reset Complete - SormatSea{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-header text-center py-4" style="background: linear-gradient(135deg, #28a745, #1e7e34);">
                    <h4 class="mb-0 text-white">
                        <i class="fas fa-check-circle me-2"></i> Password Reset Complete
                    </h4>
                </div>
                <div class="card-body p-4 text-center">
                    <i class="fas fa-check-circle" style="font-size: 4rem; color: #28a745;"></i>
                    <h5 class="mt-3">Password Changed Successfully</h5>
                    <p class="text-muted">
                        Your password has been set. You may go ahead and log in now.
                    </p>
                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'marketplace:login' %}" class="btn btn-success btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i> Log In Now
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
