<form method="post" id="paymentForm">
    {% csrf_token %}
    <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success" onclick="return confirm('Are you sure you want to proceed with the payment?')">
            Pay with ZarinPall
        </button>
        <a href="{% url 'nft_detail' slug=nft.slug %}" class="btn btn-outline-danger" onclick="return confirm('Are you sure you want to cancel?')">
            Cancel
        </a>
    </div>
</form>
